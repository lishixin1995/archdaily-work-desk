name: Apply DOB attachment support

on:
  push:
    branches:
      - codex/dob-notes-attachments

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/dob-notes-attachments
      - name: Patch DOB attachments
        run: |
          node <<'NODE'
          const fs = require('fs');

          function replaceOnce(source, search, replacement, label) {
            if (!source.includes(search)) throw new Error(`Missing block: ${label}`);
            return source.replace(search, replacement);
          }

          let main = fs.readFileSync('src/main.jsx', 'utf8');
          let css = fs.readFileSync('src/styles.css', 'utf8');

          const oldAttachmentFunction = `async function makeScreenshotAttachment(file) {
  if (!file || !file.type?.startsWith('image/')) return null;
  const originalDataUrl = await fileToDataUrl(file);
  const image = await loadImage(originalDataUrl);
  const maxWidth = 1600;
  const scale = Math.min(1, maxWidth / image.width);
  const width = Math.max(1, Math.round(image.width * scale));
  const height = Math.max(1, Math.round(image.height * scale));
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(image, 0, 0, width, height);
  const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
  return {
    id: uid(),
    name: file.name || 'Screenshot',
    type: 'image/jpeg',
    size: file.size || 0,
    width,
    height,
    dataUrl,
  };
}`;

          const newAttachmentFunction = `async function makeDobAttachment(file) {
  if (!file) return null;
  const isImage = file.type?.startsWith('image/');
  const isSupportedDocument = file.type === 'application/pdf'
    || file.type === 'application/msword'
    || file.type === 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
    || /\\.(pdf|doc|docx)$/i.test(file.name || '');
  if (!isImage && !isSupportedDocument) return null;

  if (!isImage) {
    return {
      id: uid(),
      name: file.name || 'Document',
      type: file.type || 'application/octet-stream',
      size: file.size || 0,
      kind: 'document',
      dataUrl: await fileToDataUrl(file),
    };
  }

  const originalDataUrl = await fileToDataUrl(file);
  let image;
  try {
    image = await loadImage(originalDataUrl);
  } catch {
    return {
      id: uid(),
      name: file.name || 'Screenshot',
      type: file.type || 'image/*',
      size: file.size || 0,
      kind: 'image',
      dataUrl: originalDataUrl,
    };
  }
  const maxWidth = 1600;
  const scale = Math.min(1, maxWidth / image.width);
  const width = Math.max(1, Math.round(image.width * scale));
  const height = Math.max(1, Math.round(image.height * scale));
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(image, 0, 0, width, height);
  const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
  return {
    id: uid(),
    name: file.name || 'Screenshot',
    type: 'image/jpeg',
    size: file.size || 0,
    kind: 'image',
    width,
    height,
    dataUrl,
  };
}

function getSavedAttachments(item) {
  const attachments = Array.isArray(item?.attachments) ? item.attachments : [];
  const legacyScreenshot = !attachments.length && item?.screenshot ? [{ ...item.screenshot, kind: 'image' }] : [];
  return [...attachments, ...legacyScreenshot].filter((attachment) => attachment?.dataUrl);
}

function isImageAttachment(attachment) {
  return attachment?.kind === 'image'
    || attachment?.type?.startsWith('image/')
    || attachment?.dataUrl?.startsWith('data:image/');
}

function formatFileSize(bytes = 0) {
  if (!bytes) return '';
  if (bytes < 1024) return \`${'${bytes}'} B\`;
  if (bytes < 1024 * 1024) return \`${'${Math.round(bytes / 1024)}'} KB\`;
  return \`${'${(bytes / (1024 * 1024)).toFixed(1)}'} MB\`;
}`;

          main = replaceOnce(main, oldAttachmentFunction, newAttachmentFunction, 'attachment helper');
          main = replaceOnce(
            main,
            `function FullNoteModal({ open, title, eyebrow = 'Full notes', meta = [], sections = [], images = [], copyText = '', onClose }) {
  useEffect(() => {`,
            `function FullNoteModal({ open, title, eyebrow = 'Full notes', meta = [], sections = [], images = [], attachments, copyText = '', onClose }) {
  const savedAttachments = attachments || images;

  useEffect(() => {`,
            'modal signature'
          );

          const oldModalAttachments = `          {images.length > 0 && (
            <section className="modalSection screenshotSection">
              <h3>Saved screenshot</h3>
              <div className="modalImageGrid">
                {images.map((image, index) => (
                  <figure key={image.id || image.name || index} className="modalImageCard">
                    <img src={image.dataUrl || image.src} alt={image.name || 'Saved screenshot'} />
                    {image.name && <figcaption>{image.name}</figcaption>}
                  </figure>
                ))}
              </div>
            </section>
          )}`;
          const newModalAttachments = `          {savedAttachments.length > 0 && (
            <section className="modalSection screenshotSection">
              <h3>Saved attachments</h3>
              <div className="modalImageGrid">
                {savedAttachments.map((attachment, index) => (
                  <figure key={attachment.id || attachment.name || index} className={\`modalImageCard ${'${isImageAttachment(attachment) ? \'\' : \'documentCard\'}'}\`}>
                    {isImageAttachment(attachment) ? (
                      <img src={attachment.dataUrl || attachment.src} alt={attachment.name || 'Saved attachment'} />
                    ) : (
                      <a className="documentAttachment" href={attachment.dataUrl} download={attachment.name || 'document'}>
                        <span>{attachment.type?.includes('pdf') ? 'PDF' : 'DOC'}</span>
                        <strong>{attachment.name || 'Saved document'}</strong>
                        {formatFileSize(attachment.size) && <small>{formatFileSize(attachment.size)}</small>}
                      </a>
                    )}
                    {attachment.name && <figcaption>{attachment.name}</figcaption>}
                  </figure>
                ))}
              </div>
            </section>
          )}`;
          main = replaceOnce(main, oldModalAttachments, newModalAttachments, 'modal attachments');

          main = replaceOnce(
            main,
            `function DobNotes({ dobNotes, setDobNotes }) {
  const [form, setForm] = useState({ date: todayISO(), category: 'General', title: '', notes: '', screenshot: null });`,
            `function DobNotes({ dobNotes, setDobNotes }) {
  const [form, setForm] = useState({ date: todayISO(), category: 'General', title: '', notes: '', attachments: [] });`,
            'dob form state'
          );
          main = replaceOnce(
            main,
            `  const filtered = dobNotes.filter((note) => matchesQuery(note, search) && (category === 'All' || note.category === category));`,
            `  const filtered = dobNotes.filter((note) => matchesQuery(note, search) && (category === 'All' || note.category === category));
  const openNoteAttachments = openNote ? getSavedAttachments(openNote) : [];`,
            'open note attachments'
          );

          const oldDobHandlers = `  async function handleScreenshotFiles(files) {
    const file = Array.from(files || []).find((item) => item.type?.startsWith('image/'));
    if (!file) return;
    const screenshot = await makeScreenshotAttachment(file);
    if (screenshot) setForm((current) => ({ ...current, screenshot }));
  }

  function addNote(event) {
    event.preventDefault();
    if (!form.title.trim() && !form.notes.trim()) return;
    setDobNotes([{ ...form, id: uid(), createdAt: new Date().toISOString() }, ...dobNotes]);
    setForm({ date: todayISO(), category: form.category, title: '', notes: '', screenshot: null });
  }`;
          const newDobHandlers = `  async function handleAttachmentFiles(files) {
    const attachments = (await Promise.all(Array.from(files || []).map(makeDobAttachment))).filter(Boolean);
    if (attachments.length) {
      setForm((current) => ({ ...current, attachments: [...(current.attachments || []), ...attachments] }));
    }
  }

  function removeAttachment(id) {
    setForm((current) => ({
      ...current,
      attachments: (current.attachments || []).filter((attachment) => attachment.id !== id),
    }));
  }

  function addNote(event) {
    event.preventDefault();
    if (!form.title.trim() && !form.notes.trim() && !(form.attachments || []).length) return;
    setDobNotes([{ ...form, id: uid(), createdAt: new Date().toISOString() }, ...dobNotes]);
    setForm({ date: todayISO(), category: form.category, title: '', notes: '', attachments: [] });
  }`;
          main = replaceOnce(main, oldDobHandlers, newDobHandlers, 'dob handlers');

          const oldUploadLabel = `        <label
          className={\`wide screenshotDrop ${'${form.screenshot ? \'hasScreenshot\' : \'\'}'}\`}
          onDragOver={(event) => event.preventDefault()}
          onDrop={(event) => {
            event.preventDefault();
            handleScreenshotFiles(event.dataTransfer.files);
          }}
        >
          Screenshot upload
          <input type="file" accept="image/*" onChange={(e) => handleScreenshotFiles(e.target.files)} />
          <span>Drag a screenshot here, or click to browse/upload.</span>
          {form.screenshot && (
            <div className="screenshotPreview">
              <img src={form.screenshot.dataUrl} alt={form.screenshot.name || 'Screenshot preview'} />
              <div>
                <strong>{form.screenshot.name || 'Screenshot saved'}</strong>
                <button type="button" onClick={(event) => { event.preventDefault(); setForm({ ...form, screenshot: null }); }}>Remove</button>
              </div>
            </div>
          )}
        </label>`;
          const newUploadLabel = `        <label
          className={\`wide screenshotDrop ${'${(form.attachments || []).length ? \'hasScreenshot\' : \'\'}'}\`}
          onDragOver={(event) => event.preventDefault()}
          onDrop={(event) => {
            event.preventDefault();
            handleAttachmentFiles(event.dataTransfer.files);
          }}
        >
          Attachment upload
          <input
            type="file"
            multiple
            accept="image/*,.pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document"
            onChange={(e) => {
              handleAttachmentFiles(e.target.files);
              e.target.value = '';
            }}
          />
          <span>Drag screenshots, PDF, or Word documents here, or click to browse/upload.</span>
          {(form.attachments || []).length > 0 && (
            <div className="screenshotPreviewGrid">
              {form.attachments.map((attachment) => (
                <div key={attachment.id} className="screenshotPreview">
                  {isImageAttachment(attachment) ? (
                    <img src={attachment.dataUrl} alt={attachment.name || 'Attachment preview'} />
                  ) : (
                    <div className="documentThumb">{attachment.type?.includes('pdf') ? 'PDF' : 'DOC'}</div>
                  )}
                  <div>
                    <strong>{attachment.name || 'Attachment saved'}</strong>
                    {formatFileSize(attachment.size) && <small>{formatFileSize(attachment.size)}</small>}
                    <button type="button" onClick={(event) => { event.preventDefault(); removeAttachment(attachment.id); }}>Remove</button>
                  </div>
                </div>
              ))}
            </div>
          )}
        </label>`;
          main = replaceOnce(main, oldUploadLabel, newUploadLabel, 'upload label');

          main = replaceOnce(
            main,
            `      {openNote && <FullNoteModal open eyebrow="DOB Notes" title={openNote.title || 'DOB Note'} meta={[["Date", niceDate(openNote.date)], ["Category", openNote.category], ["Screenshot", openNote.screenshot ? 'Attached' : '—']]} sections={[["Full DOB note", openNote.notes]]} images={openNote.screenshot ? [openNote.screenshot] : []} copyText={openNote.notes || ''} onClose={() => setOpenNote(null)} />}`,
            `      {openNote && <FullNoteModal open eyebrow="DOB Notes" title={openNote.title || 'DOB Note'} meta={[["Date", niceDate(openNote.date)], ["Category", openNote.category], ["Attachments", openNoteAttachments.length ? \`${'${openNoteAttachments.length}'} attached\` : '—']]} sections={[["Full DOB note", openNote.notes]]} attachments={openNoteAttachments} copyText={openNote.notes || ''} onClose={() => setOpenNote(null)} />}`,
            'dob modal'
          );

          const oldNoteCards = `function NoteCards({ items, kind, onOpen, onDelete, getTitle, getBody }) {
  return (
    <section className="libraryGrid">
      {items.length === 0 ? <div className="empty wideEmpty">No saved items yet.</div> : items.map((item) => (
        <article key={item.id} className="libraryCard" onClick={() => onOpen(item)}>
          <p className="eyebrow">{item.category || kind}{item.screenshot ? ' · Screenshot' : ''}</p>
          <h3>{getTitle(item)}</h3>
          <p className="clampedText">{getBody(item)}</p>
          <div className="cardActions" onClick={(event) => event.stopPropagation()}>
            <button type="button" onClick={() => onOpen(item)}>View full notes</button>
            <button type="button" className="danger" onClick={() => onDelete(item.id)}>Delete</button>
          </div>
        </article>
      ))}
    </section>
  );
}`;
          const newNoteCards = `function NoteCards({ items, kind, onOpen, onDelete, getTitle, getBody }) {
  return (
    <section className="libraryGrid">
      {items.length === 0 ? <div className="empty wideEmpty">No saved items yet.</div> : items.map((item) => {
        const attachmentCount = getSavedAttachments(item).length;
        return (
          <article key={item.id} className="libraryCard" onClick={() => onOpen(item)}>
            <p className="eyebrow">{item.category || kind}{attachmentCount ? \` · ${'${attachmentCount}'} attachment${'${attachmentCount > 1 ? \'s\' : \'\'}'}\` : ''}</p>
            <h3>{getTitle(item)}</h3>
            <p className="clampedText">{getBody(item)}</p>
            <div className="cardActions" onClick={(event) => event.stopPropagation()}>
              <button type="button" onClick={() => onOpen(item)}>View full notes</button>
              <button type="button" className="danger" onClick={() => onDelete(item.id)}>Delete</button>
            </div>
          </article>
        );
      })}
    </section>
  );
}`;
          main = replaceOnce(main, oldNoteCards, newNoteCards, 'note cards');

          const cssAppend = `

/* DOB Notes multi-attachment upload support. */
.screenshotPreviewGrid {
  display: grid;
  gap: 10px;
  margin-top: 12px;
}
.screenshotPreviewGrid .screenshotPreview { margin-top: 0; }
.screenshotPreview small {
  display: block;
  margin: -2px 0 6px;
  color: var(--muted);
  font-size: 11px;
  font-weight: 800;
}
.documentThumb {
  width: 92px;
  height: 64px;
  display: grid;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: rgba(238,228,214,.82);
  color: var(--warmDark);
  font-size: 14px;
  font-weight: 950;
  letter-spacing: .08em;
}
.documentAttachment {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: 6px 12px;
  align-items: center;
  padding: 16px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: rgba(255,255,255,.74);
  color: var(--ink);
  text-decoration: none;
}
.documentAttachment:hover {
  border-color: rgba(163,102,58,.42);
  background: white;
}
.documentAttachment span {
  grid-row: span 2;
  width: 54px;
  height: 54px;
  display: grid;
  place-items: center;
  border-radius: 14px;
  background: rgba(163,102,58,.14);
  color: var(--warmDark);
  font-size: 13px;
  font-weight: 950;
  letter-spacing: .08em;
}
.documentAttachment strong {
  min-width: 0;
  overflow-wrap: anywhere;
}
.documentAttachment small {
  color: var(--muted);
  font-size: 12px;
  font-weight: 800;
}
`;
          if (!css.includes('DOB Notes multi-attachment upload support.')) css += cssAppend;

          fs.writeFileSync('src/main.jsx', main);
          fs.writeFileSync('src/styles.css', css);
          fs.rmSync('.github/workflows/codex-apply-dob-attachments.yml', { force: true });
          NODE
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.jsx src/styles.css .github/workflows/codex-apply-dob-attachments.yml
          git commit -m "Support DOB note attachments"
          git push origin codex/dob-notes-attachments
